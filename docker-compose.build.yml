# Build the image from this checkout instead of pulling it:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The blueprint submodule is not needed to build, so a plain `git clone` is enough.
services:
  app:
    build:
      context: .
      args:
        VERSION: source
    image: tmpio:source
    pull_policy: build
