name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_owner
          POSTGRES_PASSWORD: app
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U app_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: app
      DATABASE_URL: postgres://app_user:app@127.0.0.1:5433/tmp?sslmode=disable
      DATABASE_OWNER_URL: postgres://app_owner:app@127.0.0.1:5433/tmp?sslmode=disable
      TEST_DATABASE_URL: postgres://app_user:app@127.0.0.1:5433/tmp_test?sslmode=disable
      TEST_DATABASE_OWNER_URL: postgres://app_owner:app@127.0.0.1:5433/tmp_test?sslmode=disable
      SESSION_SECRET: 0123456789abcdef0123456789abcdef
      DEV_LOGIN_BYPASS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          # The go directive in go.mod is the minimum language version this
          # code needs, not the toolchain to test with. Building on exactly
          # that version means building on 1.26.0, which is missing every
          # standard library security fix released since it, and govulncheck
          # fails the build for all 26 of them.
          go-version: stable
          check-latest: true
      - name: Create roles and databases
        run: |
          psql -h 127.0.0.1 -p 5433 -U app_owner -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_user LOGIN PASSWORD 'app' NOBYPASSRLS;" \
            -c "CREATE DATABASE tmp OWNER app_owner;" \
            -c "CREATE DATABASE tmp_test OWNER app_owner;"
          for d in tmp tmp_test; do
            psql -h 127.0.0.1 -p 5433 -U app_owner -d $d -v ON_ERROR_STOP=1 \
              -c "GRANT USAGE ON SCHEMA public TO app_user; ALTER DEFAULT PRIVILEGES FOR ROLE app_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user; ALTER DEFAULT PRIVILEGES FOR ROLE app_owner IN SCHEMA public GRANT USAGE ON SEQUENCES TO app_user; ALTER DEFAULT PRIVILEGES FOR ROLE app_owner IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO app_user;"
          done
      - name: Migrate
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir migrations postgres "$DATABASE_OWNER_URL" up
          goose -dir migrations postgres "$TEST_DATABASE_OWNER_URL" up
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Boundary checks
        run: make check
      - name: The installer's embedded compose file matches the real one
        run: |
          bash install.sh --print-compose > /tmp/embedded.yml
          diff -u docker-compose.yml /tmp/embedded.yml
      - name: Installer parses
        run: bash -n install.sh && sudo bash install.sh --dry-run --domain tmp.example.com --email ci@example.com
      - name: Test
        run: go test ./... -race -count=1 -p 1
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
