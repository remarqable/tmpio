# Publishes the container image. A tag builds and pushes; a push to main
# refreshes :edge so the tip is always installable without waiting for a tag.
#
# Tagging v1.4.2 publishes :1.4.2, :1.4, :1 and :latest. Self-hosters are told
# to pin :1, which brings them fixes and features but never a breaking change.
#
# Every build ships amd64 and arm64, so an ARM host (Ampere, Graviton, a Pi)
# pulling :1 or :edge gets an image. The Dockerfile cross-compiles the Go
# binary on the runner's own architecture and only copies it into each
# platform's image, so nothing runs under emulation: arm64 used to be built
# through QEMU, which turned a two-minute build into a ten-to-twenty-minute
# one.
name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=tmp
            org.opencontainers.image.description=A publishing layer for your AI
            org.opencontainers.image.licenses=MIT

      - id: stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
