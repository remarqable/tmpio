{{define "content"}}
<div class="auth-shell">
  <div class="auth-brand">
    <a class="auth-mark" href="/">tmp<span>.</span></a>
    <p class="auth-tagline">{{t "app.tagline"}}</p>
  </div>
  {{if .ClientName}}<div class="auth-note">{{t "landing.signin_authorize" "client" .ClientName}}</div>{{end}}
  {{template "partials/_signin.html" .}}
  <p class="auth-foot"><a href="{{.SourceURL}}" rel="noopener">{{t "landing.foot.source"}}</a></p>
</div>
{{end}}
